[build-system]
# PEP 639 (license = "MIT", license-files) needs setuptools >= 77
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-nvim-release"
description = "Neovim from PyPI: pip install \"fast-nvim-release==0.12.*\", then one setup command."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "fast-nvim-release contributors" }]
keywords = ["neovim", "nvim", "editor", "binary", "wheels", "vim"]
dynamic = ["version"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Editors",
]

[project.urls]
Homepage = "https://github.com/nickeisenberg/fast-nvim-release"
Issues = "https://github.com/nickeisenberg/fast-nvim-release/issues"
Source = "https://github.com/nickeisenberg/fast-nvim-release"

[project.scripts]
fast-nvim-release = "fast_nvim_release.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    # `typing.Dict`/`Optional` in signatures is fine on 3.9; rewriting every
    # annotation to `X | None` buys nothing and upsets get_type_hints there.
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]
