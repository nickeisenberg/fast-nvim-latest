[build-system]
# PEP 639 (license = "MIT", license-files) needs setuptools >= 77
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-nvim-latest"
description = "Neovim, shipped in a pip wheel: one install, one setup command."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "fast-nvim-latest contributors" }]
keywords = ["neovim", "nvim", "editor", "binary", "wheels", "vim"]
dynamic = ["version"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Editors",
]

[project.urls]
# point at the repository as it exists today; GitHub redirects if it is
# renamed to fast-nvim-latest
Homepage = "https://github.com/nicholas/fast-nvim"
Issues = "https://github.com/nicholas/fast-nvim/issues"
Source = "https://github.com/nicholas/fast-nvim"

[project.scripts]
fast-nvim-latest = "fast_nvim_latest.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "fast_nvim_latest.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    # `typing.Dict`/`Optional` in signatures is fine on 3.9; rewriting every
    # annotation to `X | None` buys nothing and upsets get_type_hints there.
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]
