[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-nvim"
description = "Neovim, shipped in a pip wheel: one install, one setup command."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "fast-nvim contributors" }]
keywords = ["neovim", "nvim", "editor", "binary", "wheels", "vim"]
dynamic = ["version"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Editors",
]

[project.urls]
Homepage = "https://github.com/nicholas/fast-nvim"
Issues = "https://github.com/nicholas/fast-nvim/issues"
Source = "https://github.com/nicholas/fast-nvim"

[project.scripts]
fast-nvim = "fast_nvim.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "fast_nvim.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
