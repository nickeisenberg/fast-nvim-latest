name: ci

# Fast feedback on every change: lint, plus a real wheel built, validated and
# smoke-tested on each supported OS/Python. Nothing here publishes anything.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # archives are ~12 MB each and the pin changes rarely; see the cache steps
  NVIM_CACHE: ~/.cache/fast-nvim-release

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install ruff
        # pinned: a new ruff release must not turn CI red on its own
        run: python -m pip install --upgrade pip ruff==0.16.10
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .

  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest now means 26.04, which setup-python has no 3.9 for
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: unit tests (no network, fake binary)
        run: python -m pytest -q
      - name: restore the Neovim archive cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.NVIM_CACHE }}
          key: nvim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/fast_nvim_release/platforms.py') }}
      # building needs tarfile's extraction filters, which setup-python's
      # 3.9 on macOS/Windows (3.9.13) lacks; the wheel is py3-none either way,
      # and the smoke test below installs it into the matrix Python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install build tooling
        run: python -m pip install -r requirements-ci.txt
      - name: vendor Neovim for this platform
        run: python scripts/fetch_nvim.py
      - name: build the wheel
        run: python -m build --wheel --outdir dist
      - name: build the old-glibc Linux wheel too
        if: runner.os == 'Linux'
        run: python scripts/build_wheels.py --wheel manylinux_2_17_x86_64.manylinux2014_x86_64
      - name: validate the wheels
        shell: bash
        run: python -m twine check dist/* && python scripts/check_wheels.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install it and use it
        run: python scripts/smoke_test.py
      - name: install the old-glibc wheel and use it
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/smoke_test.py dist/*-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
