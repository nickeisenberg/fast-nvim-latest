name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the built wheels to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # never cancel a release build half way through a publish
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # archives are ~12 MB each and the pin changes rarely; see the cache steps
  NVIM_CACHE: ~/.cache/fast-nvim-latest

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .

  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build twine
      - name: unit tests (no network, fake binary)
        run: python -m pytest -q
      - name: restore the Neovim archive cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NVIM_CACHE }}
          key: nvim-${{ runner.os }}-${{ hashFiles('src/fast_nvim_latest/platforms.py') }}
      - name: vendor Neovim for this platform
        run: python scripts/fetch_nvim.py
      - name: build the wheel
        run: python -m build --wheel --outdir dist
      - name: validate the wheel
        run: |
          python -m twine check dist/*
          python scripts/check_wheels.py
      - name: install it and use it
        run: python scripts/smoke_test.py

  build:
    name: build all platform wheels
    # a PR only needs the host wheel (built by `test`); the six-wheel matrix
    # runs on main and on tags
    if: github.event_name != 'pull_request'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: restore the Neovim archive cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NVIM_CACHE }}
          key: nvim-linux-${{ hashFiles('src/fast_nvim_latest/platforms.py') }}
      - name: build one wheel per platform
        run: python scripts/build_wheels.py --all
      - name: validate metadata, payloads and tags
        run: |
          python -m twine check dist/*
          python scripts/check_wheels.py
      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 14

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fast-nvim-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          attestations: true

  publish-pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fast-nvim-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check that the tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import fast_nvim_latest; print(fast_nvim_latest.__version__)")
          echo "tag=$tag version=$version"
          test "$tag" = "$version"
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - name: validate the wheels and the tag
        run: python scripts/check_wheels.py --expect-version "${GITHUB_REF_NAME#v}" dist/*.whl
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
