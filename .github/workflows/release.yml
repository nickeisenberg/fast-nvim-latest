name: release

# Six wheels, validated, then uploaded — but only for a `v*` tag or a manual
# run. Publishing is irreversible (PyPI refuses an existing version), so this
# is deliberately separate from ci.yml and gated twice: by the trigger and by
# the version check.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also upload the wheels to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

# a release must never be cancelled half way through a publish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # archives are ~12 MB each and the pin changes rarely; see the cache step
  NVIM_CACHE: ~/.cache/fast-nvim-release

jobs:
  build:
    name: build all platform wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install tooling
        run: |
          python -m pip install --upgrade pip
          # pinned, and marker-guarded: their newest versions need Python
          # >= 3.10 while this package still supports (and tests) 3.9
          python -m pip install "pytest==9.1.1; python_version >= '3.10'" "pytest==8.4.2; python_version < '3.10'" "build==1.6.1; python_version >= '3.10'" "build==1.4.0; python_version < '3.10'" "twine==7.0.0; python_version >= '3.10'" "twine==6.2.0; python_version < '3.10'"
      - name: unit tests
        run: python -m pytest -q
      - name: restore the Neovim archive cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NVIM_CACHE }}
          key: nvim-linux-${{ runner.arch }}-${{ hashFiles('src/fast_nvim_release/platforms.py') }}
      - name: build one wheel per platform
        run: python scripts/build_wheels.py --all
      - name: validate metadata, payloads and tags
        run: |
          python -m twine check dist/*
          python scripts/check_wheels.py
      - name: install the linux wheel in a clean venv and use it
        run: python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 14

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fast-nvim-release
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      # a rehearsal is worthless if it skips the gate the real upload runs
      - name: validate the wheels before uploading
        run: python scripts/check_wheels.py dist/*.whl
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          attestations: true

  publish-pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fast-nvim-release
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check that the tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import fast_nvim_release; print(fast_nvim_release.__version__)")
          echo "tag=$tag version=$version"
          test "$tag" = "$version"
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - name: validate the wheels and the tag
        run: python scripts/check_wheels.py --expect-version "${GITHUB_REF_NAME#v}" dist/*.whl
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
